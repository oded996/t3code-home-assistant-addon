---
name: "T3 Code"
description: "Headless T3 Code server for remote-controlled AI coding agents (Claude Code, Codex, OpenCode) with Home Assistant MCP"
version: "0.1.7"
slug: "t3code"
url: "https://github.com/oded996/t3code-home-assistant-addon"
image: "ghcr.io/oded996/t3code-{arch}"
init: false

arch:
  - aarch64
  - amd64

startup: services
boot: auto

# Status page (T3 Connect login state, LAN pairing). No T3 Code UI is served here.
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-outline
panel_title: "T3 Code"
panel_admin: true

# Only used in "lan" remote mode. Disabled by default.
ports:
  3773/tcp: null
ports_description:
  3773/tcp: "T3 Code server (LAN pairing mode only)"

options:
  remote_mode: "t3_connect"
  claude_code_oauth_token: ""
  anthropic_api_key: ""
  openai_api_key: ""
  lan_port: 3773
  extra_project_dirs: []
  git_init_config: false
  git_exclude_patterns:
    - ".storage/"
    - ".cache/"
    - ".cloud/"
    - "deps/"
    - "tts/"
    - "image/"
    - "backups/"
    - "custom_components/"
    - "www/community/"
    - "__pycache__/"
    - "*.pyc"
    - "*.db"
    - "*.db-shm"
    - "*.db-wal"
    - "*.db-journal"
    - "*.log"
    - "*.log.*"
    - "home-assistant_v2.db*"
  git_auto_exclude_large: true
  enable_ha_mcp: true
  log_level: "info"
schema:
  remote_mode: "list(t3_connect|lan)"
  claude_code_oauth_token: "password?"
  anthropic_api_key: "password?"
  openai_api_key: "password?"
  lan_port: "port"
  extra_project_dirs:
    - str
  git_init_config: bool
  git_exclude_patterns:
    - str
  git_auto_exclude_large: bool
  enable_ha_mcp: bool
  log_level: "list(trace|debug|info|warn|error)"

map:
  - type: config
    read_only: false
  - type: addons
    read_only: false
  - type: share
    read_only: false
  - type: ssl
    read_only: true

hassio_api: true
hassio_role: manager
homeassistant_api: true

backup_exclude:
  - "home/.npm/**"
  - "home/.cache/**"
  - "t3code/userdata/logs/**"
